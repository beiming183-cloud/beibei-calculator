tasks.named('check') {
    dependsOn tasks.named('cwAuditStateTest')
    dependsOn tasks.named('numericBudgetTest')
    dependsOn tasks.named('cwNumericalSafetyTest')
    dependsOn tasks.named('regressionTest')
    dependsOn tasks.named('cwRegressionTest')
    dependsOn tasks.named('cwSemanticTest')
    dependsOn tasks.named('cwModeRegressionTest')
    dependsOn tasks.named('cwWorkflowSpecTest')
    dependsOn tasks.named('cwCalculationStateTest')
    dependsOn tasks.named('cwWorkflowValidationTest')
    dependsOn tasks.named('cwStage6AcceptanceTest')
    dependsOn tasks.named('cwFunctionalityTest')
    dependsOn tasks.named('cwCompletenessTest')
    dependsOn tasks.named('manualFunctionsTest')
    dependsOn tasks.named('cwLayoutMetricsTest')
    dependsOn tasks.named('cwAutoCloseTest')
    dependsOn tasks.named('cwCursorPathTest')
}
