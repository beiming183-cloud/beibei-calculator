name: Android 云端构建

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源代码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 添加 Gradle 执行权限
        run: chmod +x ./gradlew

      - name: 运行完整核心回归测试
        run: ./gradlew :core:check

      # Debug APK 只用于 CI/开发验证，不作为用户长期安装包。
      # 因此不再缓存 debug.keystore，避免把 cache 错当成持久签名存储。
      - name: 构建开发调试 APK
        run: ./gradlew :app:assembleCn991Debug

      - name: 验证输入取消与后台任务边界
        shell: pwsh
        run: ./app/src/hostTest/run.ps1 -AndroidSdk $env:ANDROID_HOME

      - name: 保存开发调试 APK
        uses: actions/upload-artifact@v4
        with:
          name: beibei-debug-apk
          path: app/build/outputs/apk/cn991/debug/*.apk
          if-no-files-found: error
